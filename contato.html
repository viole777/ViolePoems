<body>

    <header>
        <nav class="navbar">
       <a href="index.html">Home</a>
      <a href="publicar.html">Publicar Poema</a>
      <a href="contato.html">Fale Conosco</a>
      <a href="sugestao.html">Sugestão</a>
        </nav>
        <h3 class="viaoda-libre-regular">Viole Poemas</h3>
    </header>
        <main>
            <section class="container contato-container">
                <p class="eyebrow">Viole Poemas</p>
                <h1>Fale conosco</h1>
                <p class="contato-intro">Tem uma ideia, dúvida ou proposta? Envie uma mensagem para nós.</p>
                <form id="formContato">
        <div class="formulario-campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>
        <div class="formulario-campo">
            <label for="assunto">Assunto:</label>
            <select name="assunto" id="assunto" required>
                <option value="">Selecione uma opção</option>
                <option value="nova atividade">Proposta de trabalho</option>
                <option value="reclamacao">Reclamação</option>
            </select>
        </div>
        <div class="formulario-campo">
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" maxlength="500" required></textarea>
        </div>
        <button type="submit" id="enviar-btn">Enviar mensagem</button>
        <p id="contato-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

</footer>
